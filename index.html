<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Pengesahan Sijil / Certificate Verification | MECSc</title>
<!--
  MECSc certificate verification page.
  Put this file + certificates.json in the same folder (e.g. /verify/index.html + /verify/certificates.json).
  WordPress: paste everything between the WP-START and WP-END comment markers into a
  "Custom HTML" block on a page with slug "verify", and set DATA_URL below to the uploaded JSON's full URL.
  (Alternative: a WordPress plugin approach exists — see README_web_guy.txt.)
-->
</head>
<body>
<!-- WP-START -->
<style>
#mecsc-verify{--g:#006b54;--g2:#e7f5ef;--r:#b3261e;--r2:#fdecea;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;max-width:560px;margin:0 auto;padding:16px;color:#1d2a26;box-sizing:border-box}
#mecsc-verify *{box-sizing:border-box}
#mecsc-verify .hd{background:var(--g);color:#fff;border-radius:14px;padding:18px 20px;text-align:center}
#mecsc-verify .hd b{font-size:28px;letter-spacing:1px;display:block}
#mecsc-verify .hd small{opacity:.9;font-size:13px}
#mecsc-verify h1{font-size:18px;margin:18px 0 6px;text-align:center}
#mecsc-verify .sub{font-size:13px;color:#5b6b66;text-align:center;margin:0 0 14px}
#mecsc-verify form{display:flex;gap:8px}
#mecsc-verify input{flex:1;padding:12px;border:1px solid #c8d3cf;border-radius:10px;font-size:16px;min-width:0}
#mecsc-verify button{padding:12px 16px;border:0;border-radius:10px;background:var(--g);color:#fff;font-size:15px;font-weight:600;cursor:pointer}
#mecsc-verify .card{margin-top:18px;border-radius:14px;padding:18px;border:2px solid}
#mecsc-verify .ok{background:var(--g2);border-color:var(--g)}
#mecsc-verify .bad{background:var(--r2);border-color:var(--r)}
#mecsc-verify .ttl{font-size:20px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:10px}
#mecsc-verify .ok .ttl{color:var(--g)} #mecsc-verify .bad .ttl{color:var(--r)}
#mecsc-verify .ic{width:34px;height:34px;border-radius:50%;color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:20px;flex:none}
#mecsc-verify .ok .ic{background:var(--g)} #mecsc-verify .bad .ic{background:var(--r)}
#mecsc-verify dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:8px 14px;font-size:15px}
#mecsc-verify dt{color:#5b6b66;font-size:12px;line-height:1.3}
#mecsc-verify dt i{display:block;font-style:normal;opacity:.8}
#mecsc-verify dd{margin:0;font-weight:600;word-break:break-word}
#mecsc-verify .wa{display:inline-block;margin-top:12px;background:#25d366;color:#fff;text-decoration:none;padding:11px 16px;border-radius:10px;font-weight:600}
#mecsc-verify .ft{font-size:12px;color:#7a8984;text-align:center;margin-top:22px;line-height:1.5}
#mecsc-verify .ft a{color:var(--g)}
@media(max-width:420px){#mecsc-verify dl{grid-template-columns:1fr}#mecsc-verify dt{margin-top:4px}}
</style>
<div id="mecsc-verify">
  <div class="hd"><b>MECSc</b><small>Malaysian Environment Cleaning Science Sdn Bhd</small></div>
  <h1>Pengesahan Sijil / Certificate Verification</h1>
  <p class="sub">Malaysian Cleaning Proficiency Course (MCPC-1 – MCPC-4)</p>
  <form id="mv-form">
    <input id="mv-id" placeholder="cth / e.g. M20251029-1434" autocomplete="off" aria-label="Certificate number">
    <button type="submit">Semak / Check</button>
  </form>
  <div id="mv-out" aria-live="polite"></div>
  <div class="ft">Imbas kod QR pada sijil atau masukkan nombor sijil.<br>Scan the QR code on the certificate or enter the certificate number.<br>
  <a href="https://www.mecsc.com.my">www.mecsc.com.my</a></div>
</div>
<script>
(function(){
  var DATA_URL = "certificates.json";          // WordPress: use full URL, e.g. https://www.mecsc.com.my/wp-content/uploads/mecsc/certificates.json
  var WA = "https://wa.me/60146419310", WA_TXT = "014-641 9310";
  var out = document.getElementById("mv-out"), inp = document.getElementById("mv-id");
  var db = null;
  function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
  function fmt(d){var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(d||"");return m?m[3]+"/"+m[2]+"/"+m[1]:esc(d);}
  function row(bm,en,v){return "<dt>"+bm+"<i>"+en+"</i></dt><dd>"+v+"</dd>";}
  function bad(id,msg){
    out.innerHTML='<div class="card bad"><div class="ttl"><span class="ic">✕</span>Tidak dijumpai / tidak sah<br>Not found / not valid</div>'+
      (id?'<p style="margin:0 0 6px">No. sijil / Cert no.: <b>'+esc(id)+'</b></p>':'')+
      '<p style="margin:0;font-size:14px">'+(msg||'Sijil ini tidak dapat disahkan. Sila hubungi MECSc untuk pengesahan.<br>This certificate could not be verified. Please contact MECSc to confirm.')+'</p>'+
      '<a class="wa" href="'+WA+'?text='+encodeURIComponent("Pengesahan sijil / Certificate verification: "+(id||""))+'" target="_blank" rel="noopener">WhatsApp MECSc '+WA_TXT+'</a></div>';
  }
  function show(id){
    id=(id||"").trim();
    if(!id){out.innerHTML="";return;}
    var key=null,u=id.toUpperCase();
    for(var k in db){if(k.toUpperCase()===u){key=k;break;}}
    var c=key&&db[key];
    if(!c){bad(id);return;}
    if(String(c.status).toLowerCase()!=="valid"){
      bad(key,'Sijil ini telah <b>DIBATALKAN</b> dan tidak sah.<br>This certificate has been <b>REVOKED</b> and is not valid.');return;}
    out.innerHTML='<div class="card ok"><div class="ttl"><span class="ic">✓</span>Sijil Disahkan<br>Certificate Verified</div><dl>'+
      row("No. Sijil","Certificate No.",esc(key))+
      row("Nama","Name",esc(c.name))+
      (String(c.ic_last4||"").trim()?row("No. K/P","IC No.","****"+esc(String(c.ic_last4).trim().slice(-4))):"")+
      (String(c.company||"").trim()?row("Syarikat","Company",esc(c.company)):"")+
      row("Kursus","Course",esc(c.course))+
      row("Tarikh Kursus","Course Date",fmt(c.course_date))+
      row("Tarikh Dikeluarkan","Issue Date",fmt(c.issue_date))+
      row("Status","Status",'<span style="color:#006b54">SAH / VALID</span>')+
      '</dl></div>';
  }
  document.getElementById("mv-form").addEventListener("submit",function(e){
    e.preventDefault(); var id=inp.value.trim();
    try{var url=new URL(location.href);url.searchParams.set("id",id);history.replaceState(null,"",url);}catch(_){}
    if(db)show(id);
  });
  var id0=new URLSearchParams(location.search).get("id")||"";
  inp.value=id0;
  fetch(DATA_URL+(DATA_URL.indexOf("?")<0?"?":"&")+"v="+Date.now(),{cache:"no-store"})
    .then(function(r){if(!r.ok)throw 0;return r.json();})
    .then(function(j){db=j;show(id0);})
    .catch(function(){bad(id0,'Sistem tidak dapat dicapai buat masa ini. Sila hubungi MECSc.<br>Verification data could not be loaded. Please contact MECSc.');});
})();
</script>
<!-- WP-END -->
</body>
</html>
